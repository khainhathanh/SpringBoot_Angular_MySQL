<div class="container">
  <div id="carouselExampleCaptions" class="carousel slide" data-bs-ride="carousel" >
    <div   class="carousel-indicators">
        <button *ngFor= "let carousel of listCarousel; index as i; first as isFirst" type="button" data-bs-target="#carouselExampleCaptions" [attr.data-bs-slide-to]="i" aria-current="true" [ngClass] = "isFirst ? 'active' : ''"  
        [attr.aria-label]="'Slide ' + (i + 1)"></button>
      </div>
    
    <div class="carousel-inner">
      <div *ngFor= "let carousel of listCarousel; index as i; first as isFirst" class="carousel-item" [ngClass]="carousel.active === 1 ? 'active' : '' ">
        <img [src]="carousel.img" class="d-block w-100" alt="carousel.alt">
      </div>
    </div>
    
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
  
  <section>
    <div class="py-5">
      <div class="row">
        <div *ngFor="let perfume of pagePerfume?.listItem; index as i; first as isFirst" class="col-md-12 col-lg-3 mb-4">
          <div class="card">
            <div class="d-flex justify-content-between p-3">
              <p class="lead mb-0">Today's Combo Offer</p>
              <div class="bg-info rounded-circle d-flex align-items-center justify-content-center shadow-1-strong">
                <p class="text-white mb-0 small">x4</p>
              </div>
            </div>
            <a (click)="getDetailPerfume(perfume.perfume.idPerfume)">
              <img [src]="perfume.picturePerfumeList[0]?.src" class="card-img-top" alt="Laptop" />
            </a>
            <div class="card-body">
  
              <div class="d-block">
  
              </div>
              <div class="d-flex justify-content-between mb-2">
                <h5 class="mb-0"><a href="#" class="text-dark text-decoration-none">{{perfume.perfume.name}}</a></h5>
                <div class="d-block">
                  <h5 class="text-dark text-end">{{perfume.smellPerfumeList[0].cost}}</h5>
                </div>
              </div>
  
              <div class="d-flex justify-content-between mb-2">
                <button type="button" class="btn btn-primary shadow-0" (click)="addCart(perfume.perfume.idPerfume, perfume.smellPerfumeList[0].idSmell)">Add to cart</button>
                <button type="button" class="btn btn-primary shadow-0" (click)="getDetailPerfume(perfume.perfume.idPerfume)">Buy now</button>
              </div>
  
              <div class="d-flex justify-content-between mb-2">
                <div class="ms-auto text-warning">
                  <i *ngFor="let start of totalRatingArray; index as i; first as isFirst" class="bi" [ngClass]="perfume.perfume.ratingLevel > i ? 'bi-star-fill' : 'bi-star' "></i>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <nav aria-label="Page navigation example">
        <ul class="pagination justify-content-center">
          <li class="page-item">
            <a class="page-link" href="#" (click)="getPagePrevious()">Previous</a>
          </li>
          <li *ngFor="let page of pagePerfume?.totalPageList; index as i; first as isFirst" class="page-item" [ngClass]="pageCurrent === page ? 'active' :''"><a class="page-link" (click)="getPagePerfume(page)">{{page}}</a></li>
          <li class="page-item">
            <a class="page-link" href="#" (click)="getPageNext()">Next</a>
          </li>
        </ul>
      </nav>
    </div>
  </section>
</div>
